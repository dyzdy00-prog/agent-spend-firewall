<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo console · Agent Spend Firewall</title>
<style>
:root{--paper:#fbfaf5;--card:#fff;--ink:#0b5d40;--ink2:#083f2c;--text:#1d2420;--mute:#5c6862;--line:#dcdfd6;--stamp:#c5301c;--warn:#8a6a00;--okbg:#e6f3ea;--nobg:#fdebe6;--wbg:#fbf3d9;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--text);font:15px/1.5 var(--sans)}
button,input,select{font:inherit}
.top{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
.brand{font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px;text-decoration:none}
.pill{font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border:1.5px solid var(--ink);color:var(--ink);border-radius:3px}
.pill.demo{border-color:var(--warn);color:var(--warn)}
.pill.stop{border-color:var(--stamp);background:var(--stamp);color:#fff}
.halt{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:0 0 18px;padding:14px 16px;border:1.5px solid var(--stamp);border-left-width:6px;border-radius:4px;background:var(--card)}
.halt b{color:var(--stamp);font:700 15px/1.3 var(--sans)}.halt span{flex:1 1 260px;color:var(--mute);font-size:14px}
.top .sp{flex:1}.top .addr{font:12px var(--mono);color:var(--mute)}
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:calc(100vh - 54px)}
.shell.demo{grid-template-columns:200px minmax(0,1fr) 300px}
nav{border-right:1px solid var(--line);padding:16px 10px;background:var(--card)}
nav button{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:5px;color:var(--text);cursor:pointer;margin-bottom:2px}
nav button:hover{background:var(--paper)}
nav button.on{background:var(--okbg);color:var(--ink2);font-weight:650}
.badge{background:var(--stamp);color:#fff;border-radius:99px;font:700 11px/1 var(--mono);padding:3px 6px}
main{padding:24px 28px 60px;min-width:0}
h1{font:400 30px/1.15 var(--serif);color:var(--ink2);margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 22px;max-width:46em}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:24px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.tile .k,.reading .k,.kh{font:600 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.tile .v{font:400 34px/1.15 var(--serif);color:var(--ink2);font-variant-numeric:tabular-nums}
.tile .v.red{color:var(--stamp)}td span.red,td small.red{color:var(--stamp)}
.tile small{color:var(--mute)}
.meter{height:8px;border:1px solid var(--ink);margin-top:8px;background:#fff}.meter i{display:block;height:100%;background:var(--ink);width:0;transition:width .3s}
.meter.hot i{background:var(--stamp)}.meter.hot{border-color:var(--stamp)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:20px;overflow-x:auto}
.card>h2{font:600 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0;padding:13px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.card .body{padding:14px 16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{font:700 11px/1 var(--mono);letter-spacing:.05em;padding:4px 6px;border-radius:3px;white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--ink)}.tag.no{background:var(--nobg);color:var(--stamp)}.tag.wait{background:var(--wbg);color:var(--warn)}.tag.cache{background:#eceee8;color:var(--mute)}
.why{color:var(--mute);font-size:13px}
.btn{border:1.5px solid var(--ink);background:var(--card);color:var(--ink);padding:8px 13px;border-radius:5px;font-weight:650;cursor:pointer}
.btn.solid{background:var(--ink);color:#fff}.btn.red{border-color:var(--stamp);color:var(--stamp)}.btn.sm{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.appr{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--wbg)}
.appr:last-child{border-bottom:0}.appr b{font:400 22px var(--serif);color:var(--ink2)}
.appr .acts{display:flex;gap:8px}
.empty{color:var(--mute);padding:18px 16px}
.form{display:grid;gap:18px;max-width:640px}
.field label{display:block;font-weight:650;margin-bottom:2px}.field p{margin:0 0 8px;color:var(--mute);font-size:13.5px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row input[type=range]{flex:1;min-width:140px;accent-color:var(--ink)}
.money{display:flex;align-items:center;border:1px solid var(--mute);border-radius:5px;background:#fff;overflow:hidden}
.money span{padding:0 8px;color:var(--mute)}.money input{border:0;padding:8px 8px 8px 0;width:92px;outline:none;font-family:var(--mono)}
input[type=text],input[type=password],select{border:1px solid var(--mute);border-radius:5px;padding:8px 10px;background:#fff}
.err{color:var(--stamp);min-height:1.4em}.okmsg{color:var(--ink)}
.picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pick{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:12px 14px;cursor:pointer;color:inherit;font:inherit}
.pick b{display:block;margin-bottom:3px}.pick small{color:var(--mute)}.pick.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.grow{flex:1 1 240px;min-width:0}
.receipt{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin:14px 0}
.receipt .tile{padding:10px 12px}.receipt .tile .v{font-size:24px}
.reading{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 14px}.reading p{margin:6px 0 8px;white-space:pre-wrap}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--bg)}.hist td:nth-child(2){min-width:150px}
.notes{margin:0;padding:0;list-style:none}.notes li,.reading p,#run td:nth-child(3){overflow-wrap:anywhere}#run td:nth-child(2){min-width:150px}#run td:nth-child(3){min-width:96px}.notes li{padding:10px 0;border-top:1px solid var(--line)}.notes li small{color:var(--mute)}
@media (max-width:720px){.picks{grid-template-columns:1fr}}
.guide .step{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line)}.guide .step:first-child{border-top:0}
.guide .mark{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font:600 12px/1 var(--mono);flex:none}
.guide .step.done .mark{background:var(--ink);color:#fff}.guide .step.done b{color:var(--mute)}.guide .step>div{flex:1 1 220px;min-width:0}.guide .step small{display:block;color:var(--mute)}
pre{background:#0b1113;color:#eef5f1;padding:14px 16px;border-radius:6px;overflow-x:auto;font:12.5px/1.6 var(--mono);margin:0;white-space:pre-wrap;word-break:break-word}
.chips{display:flex;gap:6px}.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 10px;font-size:13px;cursor:pointer}.chip.on{border-color:var(--ink);color:var(--ink);font-weight:650}
aside{border-left:1px solid var(--line);background:var(--card);padding:16px}
aside h3{font:600 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin:0 0 6px}
aside p{color:var(--mute);font-size:13.5px;margin:0 0 12px}
aside .act{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:9px 11px;margin-bottom:7px;cursor:pointer}
aside .act:hover{border-color:var(--ink)}aside .act small{display:block;color:var(--mute)}
.say{margin-top:12px;border-left:3px solid var(--ink);padding:8px 10px;background:var(--paper);font:12.5px/1.5 var(--mono);min-height:58px;white-space:pre-wrap;word-break:break-word}
.say.no{border-color:var(--stamp)}.say.wait{border-color:var(--warn)}
.modal{position:fixed;inset:0;background:rgba(10,20,15,.45);display:grid;place-items:center;z-index:20;padding:16px}
.modal .box{background:var(--card);border-radius:10px;max-width:560px;width:100%;padding:22px}
.modal h2{font:400 24px var(--serif);margin:0 0 8px;color:var(--ink2)}
.tok{font:13px var(--mono);background:var(--wbg);padding:10px;border-radius:5px;word-break:break-all;margin:8px 0}
.login{max-width:420px;margin:12vh auto;padding:0 16px}
.lnk{color:inherit;text-decoration:underline;text-decoration-color:#b9c0b5;text-underline-offset:3px;cursor:pointer}.lnk:hover{color:var(--ink);text-decoration-color:var(--ink)}
.crumb{margin:0 0 10px;font-size:13.5px}h1 .tag{vertical-align:middle;margin-left:10px}h1 .btn{vertical-align:middle;margin-left:10px;font-family:var(--sans)}
.lanew{padding:10px 16px 4px}
.lane text{font:600 9.5px var(--mono);fill:var(--mute);letter-spacing:.04em}
#ticker{overflow:hidden;white-space:nowrap;border-bottom:1px solid var(--line);background:#0b1113;color:#cfe0d6;font:12px/1 var(--mono)}
#ticker .run{display:inline-block;padding:9px 0;animation:tick 60s linear infinite}
#ticker:hover .run{animation-play-state:paused}
@keyframes tick{to{transform:translateX(-50%)}}
#ticker span{margin-right:34px}#ticker b{font-weight:700;margin-right:6px}
#ticker .paid b{color:#6fd3a4}#ticker .no b{color:#ff8a73}#ticker .cache b{color:#9fb0a6}#ticker .und b{color:#f0c544}
.spark{display:block;width:120px;height:18px}.spark .base{stroke:var(--line);stroke-width:1}
.cum{position:relative;height:150px;margin:16px 16px 6px}
.cum svg{display:block;width:100%;height:100%}
.trail{margin:14px 0 4px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:12px 14px 8px}
.trail svg{display:block;width:100%;max-width:720px;height:auto;margin-top:6px}
.trail .ln{fill:none;stroke:var(--ink);stroke-width:2;vector-effect:non-scaling-stroke}
.trail .lim{stroke:var(--stamp);stroke-width:1.5;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.trail .dot{fill:var(--card);stroke:var(--ink);stroke-width:1.5}.trail .dot.past{fill:var(--stamp);stroke:var(--stamp)}.trail .dot.now{stroke-width:3}
.trail text{font:12px var(--mono);fill:var(--mute)}.trail text.lt{fill:var(--stamp)}
.wmini{display:block;width:120px;height:30px}
.wmini .ln{fill:none;stroke:var(--ink);stroke-width:1.5}.wmini .lim{stroke:var(--stamp);stroke-width:1;stroke-dasharray:3 3}
.wmini .dot{fill:var(--ink)}.wmini .dot.past{fill:var(--stamp)}
.wmini .tk{fill:var(--mute);opacity:.45}.wmini .tk.changed{fill:var(--stamp);opacity:1}.wmini .tk.first{fill:var(--ink);opacity:1}.wmini .tk.none{fill:none;stroke:var(--mute);opacity:1}
.wnow{font:600 15px var(--mono);margin-right:8px}
.wcell{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}.wcell>div{min-width:120px}
#watches td:first-child{min-width:120px}
.wacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
/* Dark theme: the same variables with other values, and the few places that had a colour written in. */
:root[data-theme="dark"]{--paper:#0e1311;--card:#161c19;--ink:#6fd3a4;--ink2:#9be4c2;--text:#e4eae6;--mute:#93a199;--line:#2a332e;--stamp:#ff7a63;--warn:#e6bf4a;--okbg:#15301f;--nobg:#3b1b15;--wbg:#3a3112;color-scheme:dark}
[data-theme="dark"] .btn.solid,[data-theme="dark"] .pill.stop,[data-theme="dark"] .badge,[data-theme="dark"] .guide .step.done .mark{color:#0b1410}
[data-theme="dark"] .meter,[data-theme="dark"] .money,[data-theme="dark"] input[type=text],[data-theme="dark"] input[type=password],[data-theme="dark"] input[type=search],[data-theme="dark"] select,[data-theme="dark"] .money input{background:#0e1311;color:var(--text)}
[data-theme="dark"] .tag.cache{background:#232b27}[data-theme="dark"] .lnk{text-decoration-color:#4a5650}
@media print{:root[data-theme="dark"]{--paper:#fbfaf5;--card:#fff;--ink:#0b5d40;--ink2:#083f2c;--text:#1d2420;--mute:#5c6862;--line:#dcdfd6;--stamp:#c5301c;--warn:#8a6a00;--okbg:#e6f3ea;--nobg:#fdebe6;--wbg:#fbf3d9;color-scheme:light}#themeBtn{display:none}}
.mbar{display:flex;height:22px;border-radius:5px;overflow:hidden;background:var(--bg);border:1px solid var(--line);margin:4px 0 12px}
.mbar i{display:block;height:100%}.mbar .p,.mkey .p{background:var(--ink)}.mbar .s,.mkey .s{background:var(--stamp)}.mbar .c,.mkey .c{background:#b4bab0}
.mkeys{display:flex;flex-wrap:wrap;gap:10px 28px;margin-bottom:10px}.mkey{display:flex;gap:8px;align-items:flex-start}.mkey>i{flex:none;width:12px;height:12px;border-radius:3px;margin-top:4px}.mkey small{display:block;color:var(--mute)}
@media(min-width:1280px){#watches td:nth-child(2){min-width:270px}}
.cum .area{fill:var(--okbg)}.cum .line{fill:none;stroke:var(--ink);stroke-width:2;vector-effect:non-scaling-stroke}
.cum .bud{stroke:var(--stamp);stroke-width:1.5;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.cum .grid{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.cum .now{position:absolute;right:-5px;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 0 rgba(11,93,64,.5);animation:ping 1.5s ease-out infinite}
@keyframes ping{to{box-shadow:0 0 0 12px rgba(11,93,64,0)}}
.cum .lb{position:absolute;left:0;font:600 11px/1 var(--mono);color:var(--stamp);background:var(--card);padding:0 5px 0 0;margin-top:-13px}
.cum .lb.g{color:var(--ink);right:14px;left:auto;margin-top:-18px;padding:0}
.axis{display:flex;justify-content:space-between;padding:0 16px 12px;font:11px var(--mono);color:var(--mute)}
.heat{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;padding:16px 16px 8px}
.heat i{display:block;aspect-ratio:1.6;background:#eef0ea;border-radius:2px}
.heat i.paid{background:var(--ink)}.heat i.no{background:var(--stamp)}.heat i.cache{background:#b4bab0}.heat i.und{background:#d9a400}
.heat i.mix{background:linear-gradient(135deg,var(--ink) 50%,var(--stamp) 50%)}
.heat i.cur{outline:2px solid var(--ink2);outline-offset:1px;animation:blink 1.4s ease-in-out infinite}
.lead{font:400 21px/1.45 var(--serif);color:var(--ink2);max-width:40em;margin:0 0 22px}
.lead b{font-weight:400;border-bottom:2px solid var(--ink)}.lead b.red{border-color:var(--stamp);color:var(--stamp)}
.bars{display:flex;align-items:flex-end;gap:3px;height:150px;padding:16px 16px 0}
.bars .col{flex:1;display:flex;flex-direction:column-reverse;height:100%;min-width:0}
.bars .col i{display:block;min-height:0}.bars .p{background:var(--ink)}.bars .c{background:#b4bab0}.bars .s{background:var(--stamp)}
.barsx{display:flex;gap:3px;padding:6px 16px 4px;font:11px var(--mono);color:var(--mute)}.barsx span{flex:1;text-align:center;min-width:0;overflow:hidden;white-space:nowrap}
.barkey{display:flex;gap:16px;flex-wrap:wrap;padding:6px 16px 14px;font-size:13px;color:var(--mute)}.barkey i{display:inline-block;width:10px;height:10px;margin-right:6px}
.repfoot{color:var(--mute);font-size:13px;margin-top:8px}
.printonly{display:none;font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);margin:0 0 10px}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff}.top,nav,aside,.noprint,#ticker{display:none!important}
  .shell,.shell.demo{display:block;min-height:0}main{padding:0}
  .card,.tile,.lead{break-inside:avoid}.card{overflow:visible}.printonly{display:block}
}
@media (prefers-reduced-motion:reduce){#ticker .run,.cum .now,.heat i.cur{animation:none}}
@media (max-width:860px){.spark{width:70px}.lane text{display:none}}
.lane{display:block;width:100%;height:auto}
.lane .trk{stroke:#b9c0b5;stroke-width:2;stroke-dasharray:3 7;animation:march 1.1s linear infinite}
@keyframes march{to{stroke-dashoffset:-10}}
.lane .node{fill:#fff;stroke:var(--ink);stroke-width:2}.lane .glyph{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lane .sh{fill:#fff;stroke:var(--ink);stroke-width:2.4;transition:fill .15s,stroke .15s}
.lane.hit .sh{fill:var(--nobg);stroke:var(--stamp)}.lane.ok .sh{fill:var(--okbg)}

@keyframes halo{0%,100%{opacity:.15}50%{opacity:1}}
.pt.paid{fill:var(--ink)}.pt.no{fill:var(--stamp)}.pt.cache{fill:#fff;stroke:#7d857a;stroke-width:2}.pt.und{fill:#d9a400}.pt.parcel{fill:var(--ink2)}
.lanek{display:grid;grid-template-columns:1fr 1fr 1fr;font:600 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:0 16px 12px}
.lanek span:nth-child(2){text-align:center;color:var(--ink)}.lanek span:nth-child(3){text-align:right}
.livedot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--stamp);margin-right:8px;animation:blink 1.4s ease-in-out infinite}

.autob{display:flex;align-items:center;width:100%;border:1.5px solid var(--ink);background:var(--okbg);color:var(--ink2);border-radius:6px;padding:8px 11px;margin-bottom:10px;cursor:pointer;font-weight:650;text-align:left}
.autob.off{background:var(--paper);border-color:var(--line);color:var(--mute)}.autob.off .livedot{background:var(--mute);animation:none}
tbody tr.fresh{animation:fresh 1.6s ease-out}
@keyframes fresh{0%{background:var(--wbg)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.lane .trk,.livedot,tbody tr.fresh,.lane.held .halo{animation:none}}
.flow{display:grid;grid-template-columns:150px minmax(60px,1fr) 260px;height:200px;margin:18px 16px}
.flowl{display:flex;flex-direction:column;justify-content:center;border-right:7px solid var(--ink2);padding-right:12px}
.flowl b{font:400 38px/1.1 var(--serif);color:var(--ink2);font-variant-numeric:tabular-nums}.flowl small{color:var(--mute)}
.flowsvg{width:100%;height:200px;display:block}
.rib{opacity:.82}.rib.paid{fill:var(--ink)}.rib.no{fill:var(--stamp)}.rib.cache{fill:#b4bab0}.rib.wait{fill:#d9a400}
.flowr{position:relative}

.fl b{font:400 20px/1 var(--serif);font-variant-numeric:tabular-nums;color:var(--ink2)}.fl small{color:var(--mute)}
.fl.no{border-color:var(--stamp)}.fl.no b{color:var(--stamp)}.fl.cache{border-color:#b4bab0}.fl.wait{border-color:#d9a400}
.two{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px}
.tape{display:block;width:100%;height:96px}
.tapew{padding:16px 16px 6px}
.tape .base{stroke:var(--line);stroke-width:1}
.tb.paid{fill:var(--ink)}.tb.no{fill:var(--stamp)}.tb.cache{fill:#fff;stroke:#9aa197;stroke-width:1}.tb.und{fill:#d9a400}
.tb.new{animation:pop .9s ease-out}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:4px 16px 14px;color:var(--mute);font-size:12.5px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;background:var(--ink)}
.legend i.no{background:var(--stamp)}.legend i.cache{background:#fff;border:1px solid #9aa197}.legend i.und{background:#d9a400}
.legend .ax{margin-left:auto;font-family:var(--mono)}
.ags{padding:6px 16px 10px}

.ag b{display:block}.ag small{color:var(--mute)}

}
